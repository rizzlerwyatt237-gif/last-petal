<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Last Petal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <canvas id="screen" width="640" height="480"></canvas>
    <section id="dialogue" hidden>
      <div id="speaker"></div>
      <div id="text"></div>
      <button id="continue">CONTINUE</button>
    </section>
    <section id="menu">
      <h1>LAST PETAL</h1>
      <p>A small horror adventure about memory, choices, and a flower that remembers.</p>
      <button id="start">START</button>
      <label class="music-loader">
        LOAD LOCAL MUSIC
        <input id="musicFiles" type="file" accept="audio/ogg,audio/mpeg,audio/wav,audio/*" multiple hidden>
      </label>
      <small id="musicStatus">No local music loaded.</small>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
